<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="3" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="64" cy="64" r="38" fill="url(#glowGrad)" opacity="0.18" filter="url(#glow)" />

  <!-- AI Voice & Neural Soundwave / Spark Icon -->
  <g fill="url(#glowGrad)" filter="url(#glow)">
    <!-- Central Soundwave Bars -->
    <rect x="36" y="52" width="6" height="24" rx="3" />
    <rect x="48" y="40" width="6" height="48" rx="3" />
    <rect x="61" y="28" width="6" height="72" rx="3" fill="#38bdf8" />
    <rect x="74" y="40" width="6" height="48" rx="3" />
    <rect x="86" y="52" width="6" height="24" rx="3" />
    
    <!-- AI Top Neural Sparkle -->
    <path d="M64 16 L66.5 22 L72.5 24.5 L66.5 27 L64 33 L61.5 27 L55.5 24.5 L61.5 22 Z" fill="#38bdf8" />
    
    <!-- Left & Right Accent Dots -->
    <circle cx="26" cy="64" r="3" fill="#06b6d4" />
    <circle cx="102" cy="64" r="3" fill="#8b5cf6" />
  </g>
</svg>
