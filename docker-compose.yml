services:
  # =========================================================================
  # 1. REDIS (BullMQ background worker & caching)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: ai_interviewer_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ai_network

  # =========================================================================
  # 2. AI SERVICE (FastAPI Python - Gemini AI & Speech/Resume ML)
  # =========================================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai_interviewer_ai_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env.prod
    environment:
      - PORT=8000
      - INTERNAL_API_KEY=internal-secret-key-ai-interviewer-2026
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5000,http://localhost:80,http://localhost,*
    networks:
      - ai_network

  # =========================================================================
  # 3. BACKEND (Node.js Express API + Socket.IO + Worker)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_interviewer_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.prod
    environment:
      - PORT=5000
      - NODE_ENV=production
      - AI_SERVICE_URL=http://ai-service:8000
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:5173,https://ai-interviewer-web-app-silk.vercel.app
      - BACKEND_URL=http://backend:5000
      - INTERNAL_API_KEY=internal-secret-key-ai-interviewer-2026
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - ai_network

  # =========================================================================
  # 4. FRONTEND (React Vite + Nginx)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
        - VITE_FIREBASE_API_KEY=AIzaSyDDP5DQcDLpIlJbnODUxVCssWhUhVeI6Uw
        - VITE_FIREBASE_AUTH_DOMAIN=mygallery-2026-v1.firebaseapp.com
        - VITE_FIREBASE_PROJECT_ID=mygallery-2026-v1
    container_name: ai_interviewer_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - ai_network

# =========================================================================
# Volumes & Networks
# =========================================================================
volumes:
  redis_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  ai_network:
    driver: bridge
